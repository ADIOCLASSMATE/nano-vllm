[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "triton>=3.0.0",
    "transformers==4.56.0",
    "xxhash",
    "nvitop>=1.6.0",
    "torch==2.8.0",
    "vllm>=0.11.0",
    "accelerate>=1.12.0",
    "flash-attn>=2.8.3",
]

[project.urls]
Homepage="https://github.com/GeeeekExplorer/nano-vllm"

[[tool.uv.index]]
url = "http://nexus.sii.shaipower.online/repository/pypi/simple"
default = true

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]
